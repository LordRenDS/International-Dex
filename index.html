<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="page">
    <header class="header">
        <h1 class="header__title">Покедекс</h1>
        <button id="sidebar-toggle" class="header__sidebar-toggle" aria-label="Фильтры">☰</button>
    </header>

    <div id="sidebar-backdrop" class="sidebar__backdrop sidebar__backdrop--hidden"></div>

    <aside id="filters-sidebar" class="sidebar sidebar--hidden">
        <div class="sidebar__header">
            <h2 class="sidebar__title">Фильтры и сортировка</h2>
            <button id="close-sidebar" class="sidebar__close-btn">&times;</button>
        </div>

        <div class="search">
            <input type="text" id="search-input" class="search__input" placeholder="Поиск по имени...">
        </div>

        <div class="filters">
            <div class="filters__group">
                <label for="generation-filter" class="filters__label">Поколение</label>
                <select id="generation-filter" class="filters__select">
                    <option value="all">Все поколения</option>
                    <!-- Опции добавятся через JS -->
                </select>
            </div>

            <div class="filters__group">
                <label for="game-filter" class="filters__label">Игра</label>
                <select id="game-filter" class="filters__select">
                    <option value="all">Все игры</option>
                    <!-- Опции добавятся через JS -->
                </select>
            </div>

            <div class="filters__group">
                <label for="status-filter" class="filters__label">Статус</label>
                <select id="status-filter" class="filters__select">
                    <option value="all">Любой статус</option>
                    <option value="is_legendary">Легендарные</option>
                    <option value="is_mythical">Мифические</option>
                    <option value="is_baby">Малыши</option>
                </select>
            </div>

            <div class="filters__group">
                <label for="sort-filter" class="filters__label">Сортировка по</label>
                <div class="filters__sort-wrapper">
                    <select id="sort-filter" class="filters__select filters__select--grow">
                        <option value="id">По номеру</option>
                        <option value="name">По имени</option>
                    </select>
                    <button id="sort-order-btn" class="filters__sort-btn">⬆️</button>
                </div>
            </div>

            <div class="filters__group">
                <label for="theme-filter" class="filters__label">Тема</label>
                <select id="theme-filter" class="filters__select">
                    <option value="system">Системная тема</option>
                    <option value="light">Светлая тема</option>
                    <option value="dark">Темная тема</option>
                </select>
            </div>

            <button id="reset-filters" class="filters__reset-btn">Сбросить фильтры</button>
        </div>
    </aside>

    <main class="main">
        <div id="pokedex-grid" class="pokedex-grid">
            <!-- Карточки будут здесь -->
        </div>
        <div id="sentinel"></div>
        <div id="loading" class="loading loading--hidden">
            <div class="loading__spinner"></div>
            <p class="loading__text">Загрузка покемонов...</p>
        </div>
    </main>

    <!-- Модальное окно -->
    <div id="pokemon-modal" class="modal modal--hidden">
        <div class="modal__content">
            <button class="modal__close-btn">&times;</button>
            <div class="modal__body">
                <!-- Контент модального окна -->
            </div>
        </div>
    </div>

    <script src="js/data/pokemon_ru_names.js"></script>
    <script src="js/data/custom_locations.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
