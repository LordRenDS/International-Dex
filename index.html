<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <h1>Покедекс</h1>
        <div class="filters">
            <select id="generation-filter">
                <option value="all">Все поколения</option>
                <!-- Опции добавятся через JS -->
            </select>

            <select id="game-filter">
                <option value="all">Все игры</option>
                <!-- Опции добавятся через JS -->
            </select>

            <select id="status-filter">
                <option value="all">Любой статус</option>
                <option value="is_legendary">Легендарные</option>
                <option value="is_mythical">Мифические</option>
                <option value="is_baby">Малыши</option>
            </select>
            <select id="theme-filter">
                <option value="system">Системная тема</option>
                <option value="light">Светлая тема</option>
                <option value="dark">Темная тема</option>
            </select>
        </div>
    </header>

    <main class="main-content">
        <div id="pokedex-grid" class="grid">
            <!-- Карточки будут здесь -->
        </div>
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Загрузка покемонов...</p>
        </div>
    </main>

    <!-- Модальное окно -->
    <div id="pokemon-modal" class="modal hidden">
        <div class="modal-content">
            <button class="close-modal">&times;</button>
            <div class="modal-body">
                <!-- Контент модального окна -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
